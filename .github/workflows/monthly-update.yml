name: Monthly data update

on:
  schedule:
    - cron: "0 6 12 * *" # 12-го числа каждого месяца в 06:00 UTC
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - name: Install dependencies
        run: pip install -r requirements-dev.txt
      - name: Download, convert, build, validate
        run: |
          python src/download.py
          python src/convert.py
          python src/build_datasets.py
          python src/validate.py
      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/processed data/dashboard data/quality
          if git diff --cached --quiet; then
            echo "Данные не изменились"
          else
            git commit -m "data: ежемесячное обновление наборов ПИФ ($(date +%Y-%m-%d))"
            git push
          fi
